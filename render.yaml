services:
  - type: web
    name: studypal-api
    runtime: python
    repo: https://github.com/xuehao680-jpg/studypal
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://inferaichat.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
